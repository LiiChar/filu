<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="filu - Медиа плеер для просмотра видео и прослушивания аудио файлов с поддержкой различных форматов" />
    <meta name="author" content="filu" />
    <meta name="keywords" content="медиа плеер, видео, аудио, filu, плеер, music, video player, yt-dlp" />
    <title>filu - Медиа плеер</title>
  </head>

  <body>
		<style>
			
.titlebar {
	background: transparent;
	user-select: none;
	display: grid;
	grid-template-columns: auto max-content;
	position: fixed;
	top: 0;
	left: 0;
	right: 0;
	z-index: 1000000000000000;
}

.titlebar > .controls {
	display: flex;
	gap: 4px;
	height: 23px;
	padding-top: 6px;
	padding-right: 6px;
	position: fixed;
	top: 0px;
	right: 0px;
	z-index: 1000000000000000;
}
.titlebar button {
	appearance: none;
	padding: 0;
	margin: 0;
	border: none;
	display: flex;
	justify-content: center;
	align-items: center;
	width: 23px;
	background-color: var(--background-glass);
	backdrop-filter: blur(10px);
	border-radius: 100%;
	padding: 7px;
	aspect-ratio: 1 / 1;
}
.titlebar button:hover {
	scale: 1.1;
	background-color: var(--secondary-glass);
}

.titlebar button:last-child:hover {
	background-color: rgba(255, 0, 0, 0.262);
}

*[data-tauri-drag-region] {
	app-region: drag;
}

.titlebar > div[data-tauri-drag-region] {
	cursor: pointer;
	height: 31px;
	position: fixed;
	top: 0;
	left: 0;
	right: 0;
	z-index: 100;
}

.pin {
	display: none;
}

.is-pin > .pin{
	display: block;
 
}

.titlebar > .controls:hover {
	opacity: 1 !important;
}

.is-pin > .unpin{
	display: none;
 
}
		</style>
    <div class="titlebar">
			<div data-tauri-drag-region></div>
			<div class="controls">
				<button id="titlebar-minimize" title="minimize">
					<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
					<path fill="currentColor" fill-rule="evenodd" d="M1 10a1 1 0 0 1 1-1h16a1 1 0 1 1 0 2H2a1 1 0 0 1-1-1" clip-rule="evenodd" stroke-width="2" stroke="currentColor" />
				</svg>
				</button>
				<button id="titlebar-maximize" title="maximize">
					<svg class="unpin" xmlns="http://www.w3.org/2000/svg" style="scale: 1.25;" width="80" height="80" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.5 14.5L3 21M5 9.485l9.193 9.193l1.697-1.697l-.393-3.787l5.51-4.673l-5.85-5.85l-4.674 5.51l-3.786-.393z"/></svg>
					<svg class="pin" xmlns="http://www.w3.org/2000/svg" style="scale: 1.25;" width="80" height="80" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M9.5 14.5L3 21"/><path fill="currentColor" d="m5 9.485l9.193 9.193l1.697-1.697l-.393-3.787l5.51-4.673l-5.85-5.85l-4.674 5.51l-3.786-.393z"/></g></svg>

				<button id="titlebar-close" title="close">
					<svg
						xmlns="http://www.w3.org/2000/svg"
						width="24"
						height="24"
						viewBox="0 0 32 32"
					>
						<path
							fill="currentColor"
							d="M24.879 2.879A3 3 0 1 1 29.12 7.12l-8.79 8.79a.125.125 0 0 0 0 .177l8.79 8.79a3 3 0 1 1-4.242 4.243l-8.79-8.79a.125.125 0 0 0-.177 0l-8.79 8.79a3 3 0 1 1-4.243-4.242l8.79-8.79a.125.125 0 0 0 0-.177l-8.79-8.79A3 3 0 0 1 7.12 2.878l8.79 8.79a.125.125 0 0 0 .177 0z"
						/>
					</svg>
				</button>
			</div>
		</div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
